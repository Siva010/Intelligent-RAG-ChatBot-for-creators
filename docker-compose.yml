version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount local backend code for hot-reloading
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      # Mount local backend code for hot-reloading
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - api
    command: celery -A app.worker.celery_app worker --loglevel=info --pool=threads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount local frontend code for hot-reloading
      - ./frontend:/app
      # Avoid local node_modules overriding the container's node_modules
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    # For Next.js hot-reloading in Windows/Docker environments
    # you sometimes need CHOKIDAR_USEPOLLING=true, but we try default first.

volumes:
  redis_data:
